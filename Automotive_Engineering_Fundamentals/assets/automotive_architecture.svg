<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="510" viewBox="0 0 1200 510" role="img" aria-labelledby="title desc">
  <title id="title">Automotive control architecture</title>
  <desc id="desc">Sensors send measurements to an ECU. The ECU commands actuators that change the vehicle state. Feedback returns to the sensors. A separate bidirectional link connects the ECU to other ECUs through the vehicle network.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 8 4 0 8" fill="none" stroke="#537b7c" stroke-width="1.2"/></marker>
  </defs>
  <rect x="1" y="1" width="1198" height="508" rx="12" fill="#fafbf9" stroke="#dce2df"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="48" y="47" font-size="13" letter-spacing="2.4" fill="#537b7c">AUTOMOTIVE ENGINEERING</text>
    <text x="48" y="91" font-size="31" font-weight="600" fill="#243332">A connected control system</text>
    <text x="48" y="124" font-size="16" fill="#63716f">Measurement, computation and physical response</text>
    <g fill="#ffffff" stroke="#d7dfdb" stroke-width="1.2">
      <rect x="48" y="183" width="240" height="120" rx="6"/>
      <rect x="336" y="183" width="240" height="120" rx="6"/>
      <rect x="624" y="183" width="240" height="120" rx="6"/>
      <rect x="912" y="183" width="240" height="120" rx="6"/>
    </g>
    <rect x="336" y="183" width="240" height="3" fill="#537b7c"/>
    <g fill="#243332" font-size="21" font-weight="600">
      <text x="68" y="220">Sensors</text><text x="356" y="220">ECU</text>
      <text x="644" y="220">Actuators</text><text x="932" y="220">Vehicle</text>
    </g>
    <g fill="#63716f" font-size="16">
      <text x="68" y="253">Speed, angle, motion</text><text x="68" y="279">Environment sensing</text>
      <text x="356" y="253">Estimation and control</text><text x="356" y="279">Diagnostics and limits</text>
      <text x="644" y="253">Drivers and power stages</text><text x="644" y="279">Steering, brake, motor</text>
      <text x="932" y="253">Force and torque</text><text x="932" y="279">Motion and feedback</text>
    </g>
    <g fill="none" stroke="#537b7c" stroke-width="1.6" marker-end="url(#arrow)">
      <path d="M288 240H327"/><path d="M576 240H615"/><path d="M864 240H903"/>
      <path d="M1032 303V463H168V312"/>
    </g>
    <text x="722" y="451" font-size="14" fill="#63716f">Measured physical state</text>
    <path d="M456 311V355" fill="none" stroke="#537b7c" stroke-width="1.6" stroke-dasharray="4 4" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <rect x="336" y="365" width="365" height="54" rx="6" fill="#edf2ef" stroke="#d7dfdb"/>
    <text x="354" y="388" font-size="16" font-weight="600" fill="#344b48">Other ECUs · Vehicle network</text>
    <text x="354" y="407" font-size="13" fill="#63716f">CAN / LIN / Ethernet · status and requests</text>
  </g>
</svg>
